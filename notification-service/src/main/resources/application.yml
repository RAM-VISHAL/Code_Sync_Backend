server:
    port: 8087

spring:
    config:
        import: optional:file:../.env[.properties]
    application:
        name: notification-service
    datasource:
        url: jdbc:mysql://${DB_HOST:localhost}:3306/${NOTIFICATION_DB_NAME:codesync_notification_db}?createDatabaseIfNotExist=true
        username: ${DB_USER:root}
        password: ${DB_PASSWORD:password}
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: false
        open-in-view: false

    mail:
        host: smtp.gmail.com
        port: 587
        username: ${EMAIL_USERNAME}
        password: ${EMAIL_APP_PASSWORD}
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true
                    # Crucial: 5s timeout to prevent thread blocking during SMTP outages
                    connectiontimeout: 5000
                    timeout: 5000
                    writetimeout: 5000
    rabbitmq:
        host: ${RABBIT_HOST:localhost}
        port: 5672

eureka:
    client:
        service-url:
            defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
    instance:
        hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
        prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:false}

management:
    endpoints:
        web:
            exposure:
                include: "health,info"
    endpoint:
        health:
            show-details: always
    health:
        # Keep local/dev health green even when SMTP credentials are missing or
        # invalid. Actual mail sending still uses spring.mail settings above.
        mail:
            enabled: false

springdoc:
    api-docs:
        path: /v3/api-docs
    swagger-ui:
        path: /swagger-ui.html
