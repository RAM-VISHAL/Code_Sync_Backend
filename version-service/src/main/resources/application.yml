server:
    port: 8086

spring:
    config:
        import: optional:file:../.env[.properties]
    application:
        name: version-service
    datasource:
        url: jdbc:mysql://${DB_HOST:localhost}:3306/${VERSION_DB_NAME:codesync_version_db}?createDatabaseIfNotExist=true
        username: ${DB_USER:root}
        password: ${DB_PASSWORD:password}
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: false
        open-in-view: false

eureka:
    client:
        service-url:
            defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
    instance:
        hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
        prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:false}

management:
    endpoints:
        web:
            exposure:
                include: "health,info"
    endpoint:
        health:
            show-details: always

springdoc:
    api-docs:
        path: /v3/api-docs
    swagger-ui:
        path: /swagger-ui.html
