server:
    port: 8088

spring:
    config:
        import: optional:file:../.env[.properties]
    application:
        name: comment-service
    datasource:
        url: jdbc:mysql://${DB_HOST:localhost}:3306/${COMMENT_DB_NAME:codesync_comment_db}?createDatabaseIfNotExist=true
        username: ${DB_USER:root}
        password: ${DB_PASSWORD:password}
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: false
        properties:
            hibernate:
                dialect: org.hibernate.dialect.MySQLDialect

eureka:
    client:
        service-url:
            defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
    instance:
        hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
        prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:false}

management:
    endpoints:
        web:
            exposure:
                include: "health,info"

springdoc:
    api-docs:
        path: /v3/api-docs
    swagger-ui:
        path: /swagger-ui.html
